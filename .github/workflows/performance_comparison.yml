name: 'Performance Comparison'

on:
  pull_request:

jobs:
  comparison:
    runs-on: ubuntu-latest
    steps:
      # PR head, checked out at the workspace root.
      - uses: actions/checkout@v4
      # Base branch, checked out separately so its own test/Project.toml [sources] path (`..`)
      # resolves to the base tree instead of the PR tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base
          fetch-depth: 1
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Run Performance Test Main (base branch)
        run: |
          cd base
          julia --project=test -e 'using Pkg; Pkg.instantiate()'
          julia --project=test test/performance/performance_test.jl "Main"
          mv solve_time_Main.csv precompile_time_Main.txt ..
      - name: Run Performance Test Branch
        run: |
          julia --project=test -e 'using Pkg; Pkg.instantiate()'
          julia --project=test test/performance/performance_test.jl "Branch"
      - name: Format results
        run: |
          julia test/performance/format_results.jl \
            solve_time_Main.csv \
            solve_time_Branch.csv \
            precompile_time_Main.txt \
            precompile_time_Branch.txt \
            performance_results.md
      - name: Read results
        id: results
        run: |
          { echo "body<<EOF"; cat performance_results.md; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Performance Results
      - name: Create comment
        if: steps.fc.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.results.outputs.body }}
      - name: Update comment
        if: steps.fc.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          body: ${{ steps.results.outputs.body }}
          edit-mode: replace
