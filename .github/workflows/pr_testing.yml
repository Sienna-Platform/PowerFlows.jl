name: Test-CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - name: Debug repository slug capitalization
        run: |
          echo "The github.repository value is: ${{ github.repository }}"
          echo "The repository owner is: ${{ github.repository_owner }}"
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/julia-buildpkg@v1
        env:
          PYTHON: ""
      - uses: julia-actions/julia-runtest@v1
        env:
          PYTHON: ""
      # Report coverage from a single job; uploading all three OS legs sent
      # duplicate reports per commit.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest'
      # Fork PRs cannot read repository secrets, so the upload is unauthenticated
      # and will fail. Keep this non-fatal here; main-tests.yml is the workflow
      # that hard-fails on upload errors.
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          files: ./lcov.info
          disable_search: true
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          # Required when CODECOV_TOKEN is an organization-level token.
          slug: ${{ github.repository }}
