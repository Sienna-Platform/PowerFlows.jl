[sources]
# Branch pins until the OpenAPI packages are registered and the psy6-line branches merge.
InfrastructureSystems = {rev = "IS4", url = "https://github.com/Sienna-Platform/InfrastructureSystems.jl.git"}
PowerSystems = {url = "https://github.com/Sienna-Platform/PowerSystems.jl.git", rev = "mb/remote-control"}
# Pinned to the branch rather than the registry: registry PNM v0.24 requires PowerSystems
# 5.11, which this line (5.10.0) does not satisfy.
PowerNetworkMatrices = {url = "https://github.com/Sienna-Platform/PowerNetworkMatrices.jl.git", rev = "jd/psy6_correctness"}

