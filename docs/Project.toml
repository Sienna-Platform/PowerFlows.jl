# Mirrors the pins in the root and `test/` environments. Only the ACTIVE project's
# `[sources]` are honored, so the docs env must repeat them — without these it resolves the
# registry PowerSystems against the infrastore InfrastructureSystems and fails to precompile.
# Remove before registering a release.
[sources]
PowerFlows = {path = ".."}
InfrastructureSystems = {rev = "IS4", url = "https://github.com/Sienna-Platform/InfrastructureSystems.jl.git"}
# Pinned to the branch rather than the registry: registry PNM v0.24 requires PowerSystems
# 5.11, which this line (5.10.0) does not satisfy.
PowerNetworkMatrices = {url = "https://github.com/Sienna-Platform/PowerNetworkMatrices.jl.git", rev = "mb/fixed-quantity-fields"}
PowerSystemCaseBuilder = {url = "https://github.com/Sienna-Platform/PowerSystemCaseBuilder.jl.git", rev = "ac/fixed-quantity-fields"}
PowerSystems = {rev = "ac/fixed-quantity-fields", url = "https://github.com/Sienna-Platform/PowerSystems.jl.git"}
# PSCB's own [sources] pin for this is ignored once PSCB is a dependency rather than the root
# project; the docs env needs its own pin so Pkg can resolve PSCB's unregistered parser dep.
PowerTableDataParser = {url = "https://github.com/NLR-Sienna/PowerTableDataParser.jl.git", rev = "ac/fixed-quantity-fields"}
PowerFlowFileParser = {url = "https://github.com/Sienna-Platform/PowerFlowFileParser.jl.git", rev = "ac/fixed-quantity-fields"}

[compat]
Documenter = "^1.0"
